# 数据库操作接口定义

- type: Database
  id: DB-FindUserByPhone
  description: 根据手机号查询用户信息
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，返回匹配的手机号用户信息
    - 如果手机号不存在，返回null
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

 

- type: Database
  id: DB-GetAirportSuggest
  description: 根据关键词联想城市与机场信息
  dependencies:
    - none
  acceptanceCriteria:
    - 输入关键词后返回最多20条城市/机场候选
    - 返回项包含城市名、机场名、三字码、城市码、是否热门
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：城市/机场联想"

- type: Database
  id: DB-SearchFlights
  description: 按条件搜索可售航班与价格套餐
  dependencies:
    - none
  acceptanceCriteria:
    - 支持单程/往返/多程查询，返回航班基础信息与套餐列表
    - 支持直飞筛选、舱位、乘客类型与数量的过滤
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：航班搜索"

- type: Database
  id: DB-GetFlightDetails
  description: 获取航班详情，包括行李额、餐食、票规摘要等
  dependencies:
    - none
  acceptanceCriteria:
    - 返回航段详细信息、服务信息、票规摘要、价格明细
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：航班详情"

- type: Database
  id: DB-CheckAndLockInventory
  description: 校验并锁定所选航班套餐库存
  dependencies:
    - none
  acceptanceCriteria:
    - 库存充足时返回锁定成功并保留锁定时长（如15分钟）
    - 库存不足时返回失败原因，不进行锁定
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：库存校验与锁定"

- type: Database
  id: DB-CheckLatestPrice
  description: 校验所选航班套餐的最新价格
  dependencies:
    - none
  acceptanceCriteria:
    - 若价格变化返回最新价格并标记需用户确认
    - 若价格未变化返回校验通过标识
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：价格校验"

- type: Database
  id: DB-CreateOrder
  description: 创建机票订单记录（含乘机人与联系人）
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后orders表新增一条订单记录并生成订单号
    - 保存乘机人、航班与套餐、应付金额、锁定信息
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：订单创建"

- type: Database
  id: DB-GetOrderById
  description: 根据订单号查询订单详情
  dependencies:
    - none
  acceptanceCriteria:
    - 返回订单基础信息、乘机人、价格、状态、票规与附加服务
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：订单查询"

- type: Database
  id: DB-UpdateOrderStatus
  description: 更新订单状态（待支付/已支付/出票中/已出票/失败）
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后订单状态正确变更并写入状态流水
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：订单状态更新"

- type: Database
  id: DB-CreatePaymentRecord
  description: 创建支付记录并关联订单
  dependencies:
    - none
  acceptanceCriteria:
    - 成功创建支付记录，包含支付方式、金额、外部交易号（占位）
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：支付记录创建"

- type: Database
  id: DB-MarkPaymentSuccess
  description: 标记支付成功并更新订单状态为已支付
  dependencies:
    - DB-UpdateOrderStatus
  acceptanceCriteria:
    - 成功执行后订单状态更新为已支付，支付记录标记成功
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：支付成功标记"

- type: Database
  id: DB-IssueTicket
  description: 出票并生成电子客票号
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后订单状态更新为已出票并生成电子客票号
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：出票"

- type: Database
  id: DB-ListOrders
  description: 根据用户ID分页查询订单列表
  dependencies:
    - none
  acceptanceCriteria:
    - 返回订单列表及分页信息，支持状态过滤
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：订单列表"

- type: Database
  id: DB-GetFareRules
  description: 查询票规（退改签规则）信息
  dependencies:
    - none
  acceptanceCriteria:
    - 返回不同舱位套餐对应的退改签规则与费用
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：票规查询"

- type: Database
  id: DB-GetBaggagePolicy
  description: 查询行李额政策（手提/托运）
  dependencies:
    - none
  acceptanceCriteria:
    - 返回所选航班与舱位对应的行李额度与限制
  changeLog:
    - date: "2025-11-15"
      description: "新增机票模块：行李政策查询"

- type: Database
  id: DB-FindUserByEmail
  description: 根据邮箱查询用户信息
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，返回匹配的邮箱用户信息
    - 如果邮箱不存在，返回null
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-FindUserByUsername
  description: 根据用户名查询用户信息
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，返回匹配的用户名信息
    - 如果用户名不存在，返回null
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-CreateUser
  description: 在数据库中创建一个新的用户记录
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，users表中会增加一条新记录
    - 如果手机号已存在，操作应失败并抛出唯一性约束错误
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-VerifyPassword
  description: 验证用户密码是否正确
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，返回密码验证结果（true/false）
    - 验证过程应使用安全的密码哈希算法
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-CreateVerificationCode
  description: 创建并存储手机验证码
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，在验证码表中创建一条新记录
    - 验证码应为6位数字，有效期为5分钟
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-VerifyCode
  description: 验证手机验证码是否正确
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，返回验证码验证结果（true/false）
    - 验证后应标记验证码为已使用
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Database
  id: DB-UpdateUserPassword
  description: 更新用户密码
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，更新users表中对应用户的密码字段
    - 密码应使用安全的哈希算法存储
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

# 常用旅客与个人信息模块（新增）

- type: Database
  id: DB-ListTravelers
  description: 分页查询当前用户的常用旅客列表
  dependencies:
    - none
  acceptanceCriteria:
    - 支持姓名关键字筛选与分页返回
    - 返回字段包含姓名、证件类型与号码（脱敏）、国籍、性别、常旅客卡
  changeLog:
    - date: "2025-11-26"
      description: "新增常用旅客：列表查询"

- type: Database
  id: DB-GetTravelerById
  description: 根据旅客ID查询旅客详情
  dependencies:
    - none
  acceptanceCriteria:
    - 返回旅客信息（中文/英文名、国籍、性别、生日、联系方式）与证件信息
    - 当记录不存在时返回null
  changeLog:
    - date: "2025-11-26"
      description: "新增常用旅客：详情查询"

- type: Database
  id: DB-CreateTraveler
  description: 创建常用旅客记录
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后新增一条旅客记录并返回ID
    - 对证件类型+证件号做唯一性校验，重复时失败
  changeLog:
    - date: "2025-11-26"
      description: "新增常用旅客：新增"

- type: Database
  id: DB-UpdateTraveler
  description: 更新常用旅客记录
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后变更旅客信息与证件信息
    - 当证件重复或记录不存在时失败
  changeLog:
    - date: "2025-11-26"
      description: "新增常用旅客：编辑"

- type: Database
  id: DB-DeleteTravelersBatch
  description: 批量删除旅客记录
  dependencies:
    - none
  acceptanceCriteria:
    - 支持一次删除多条记录；包含不可删除条目时返回失败并标注原因
    - “本人”标识的旅客不可删除
  changeLog:
    - date: "2025-11-26"
      description: "新增常用旅客：批量删除"

- type: Database
  id: DB-GetUserProfile
  description: 查询用户个人信息资料
  dependencies:
    - none
  acceptanceCriteria:
    - 返回手机号（脱敏）、邮箱状态、昵称、姓名、性别、生日
  changeLog:
    - date: "2025-11-26"
      description: "新增我的信息：资料查询"

- type: Database
  id: DB-UpdateUserProfile
  description: 更新用户个人信息（昵称、姓名、性别、生日）
  dependencies:
    - none
  acceptanceCriteria:
    - 校验昵称长度≤20、姓名≤30且不含数字特殊字符、生日格式为yyyy-MM-dd且不得为未来日期
    - 成功执行后写入变更记录并返回最新资料
  changeLog:
    - date: "2025-11-26"
      description: "新增我的信息：资料更新"
