# 前端UI接口定义

- type: Frontend
  id: UI-LoginPage
  description: 完整的登录页面组件，包含账号密码登录和验证码登录两种模式
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调函数"
  state:
    - loginType
    - account
    - password
    - phoneNumber
    - verificationCode
    - agreeToTerms
    - isLoading
    - errors
    - countdown
  dependencies:
    - API-POST-Login
    - API-POST-SendVerificationCode
    - API-POST-LoginWithCode
  acceptanceCriteria:
    - 组件应渲染登录方式切换Tab（账号密码登录和验证码登录）
    - 账号密码登录模式下应显示账号输入框、密码输入框、忘记密码链接、登录按钮
    - 验证码登录模式下应显示手机号输入框、发送验证码按钮、验证码输入框、登录按钮
    - 两种模式下都应显示服务协议复选框和免费注册链接
    - 点击登录按钮时应调用相应的API接口
    - 当isLoading状态为true时，登录按钮应被禁用
    - 登录成功后应通过onLoginSuccess导航至机票首页（/home）
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

# 常用旅客与我的信息模块（新增）

- type: Frontend
  id: UI-CommonInfoIndex
  description: 常用信息索引页，包含四个入口按钮
  properties:
    - name: onNavigate
      type: function
      description: "入口点击后的导航回调"
  state:
    - none
  dependencies:
    - none
  acceptanceCriteria:
    - 渲染“常用旅客信息/常用联系人/常用报销凭证/常用地址”四个入口
    - 点击“常用旅客信息”跳转至`/user-center/common-info/travelers`
  changeLog:
    - date: "2025-11-26"
      description: "新增：常用信息索引UI接口"

- type: Frontend
  id: UI-TravelersManagement
  description: 常用旅客信息列表页，含搜索/新增/表格/底部操作
  properties:
    - name: onSearch
      type: function
      description: "点击查询时回调"
    - name: onAdd
      type: function
      description: "点击新增时回调"
  state:
    - keyword
    - list
    - pagination
    - isLoading
    - errors
  dependencies:
    - API-GET-Travelers
  acceptanceCriteria:
    - 渲染搜索输入、查询按钮与“新增”链接
    - 表格列包含选择框、本人徽标、姓名、手机/电话、证件类型、证件号码、国籍(国家/地区)、性别、常旅客卡、操作
    - 操作包含“查看/编辑/删除”，查看链接至`/user-center/common-info/travelers/view`，编辑链接至`/user-center/common-info/travelers/edit`
    - 表格下方渲染“全选”复选框与“删除”链接
  changeLog:
    - date: "2025-11-26"
      description: "新增：常用旅客列表UI接口"

- type: Frontend
  id: UI-TravelerView
  description: 常用旅客信息查看页（只读）
  properties:
    - name: travelerId
      type: string
      description: "旅客ID"
  state:
    - traveler
    - isLoading
    - errors
  dependencies:
    - API-GET-Traveler
  acceptanceCriteria:
    - 渲染分段标题“旅客信息/证件信息/常旅客卡”与只读字段
    - 顶部显示“查看所有旅客信息”，底部显示“返回”，均跳转列表页
  changeLog:
    - date: "2025-11-26"
      description: "新增：旅客查看UI接口"

- type: Frontend
  id: UI-TravelerEdit
  description: 常用旅客信息编辑页
  properties:
    - name: travelerId
      type: string
      description: "旅客ID"
    - name: onSave
      type: function
      description: "保存回调"
  state:
    - form
    - isLoading
    - errors
  dependencies:
    - API-PUT-Traveler
  acceptanceCriteria:
    - 表单包含中文名/英文名、是否本人、国籍、性别、生日、出生地、联系方式与证件信息
    - 保存成功后提示成功并返回列表或停留当前页
    - 日期格式校验失败应阻止保存并提示
  changeLog:
    - date: "2025-11-26"
      description: "新增：旅客编辑UI接口"

- type: Frontend
  id: UI-TravelerAdd
  description: 常用旅客信息新增页
  properties:
    - name: onCreate
      type: function
      description: "新增回调"
  state:
    - form
    - isLoading
    - errors
  dependencies:
    - API-POST-Traveler
  acceptanceCriteria:
    - 表单包含中文/英文名（至少填写一项）、是否本人、国籍、性别、生日、出生地、联系方式与证件信息
    - 保存成功后返回列表页；必填项缺失或本人重复设置时阻止保存
  changeLog:
    - date: "2025-11-26"
      description: "新增：旅客新增UI接口"

- type: Frontend
  id: UI-MyInfoPage
  description: 我的信息页，含只读与编辑态切换
  properties:
    - name: onSave
      type: function
      description: "保存回调"
  state:
    - profile
    - isEditing
    - isLoading
    - errors
  dependencies:
    - API-GET-UserProfile
    - API-PATCH-UserProfile
  acceptanceCriteria:
    - 只读态显示手机（脱敏）/邮箱状态/昵称/姓名/性别/生日与“编辑”入口
    - 编辑态显示昵称/姓名/性别/生日输入控件与“保存”按钮及“新昵称将在审核后生效”提示
    - 校验规则：昵称≤20、姓名≤30不含数字、生日yyyy-MM-dd且不得为未来日期；非法输入阻止保存并显示提示
    - 顶部“收起”切换回只读态
  changeLog:
    - date: "2025-11-26"
      description: "新增：我的信息UI接口"
    - date: "2025-11-15"
      description: "补充登录成功后导航至机票首页"

- type: Frontend
  id: UI-RegisterPage
  description: 完整的注册页面组件，包含两步注册流程
  properties:
    - name: onRegisterSuccess
      type: function
      description: "注册成功后的回调函数"
  state:
    - currentStep
    - phoneNumber
    - verificationCode
    - password
    - confirmPassword
    - passwordStrength
    - showPassword
    - showConfirmPassword
    - isLoading
    - errors
    - countdown
    - tempToken
    - maskedPhone
  dependencies:
    - API-POST-SendVerificationCode
    - API-POST-RegisterStep1
    - API-POST-RegisterStep2
  acceptanceCriteria:
    - 步骤1应显示手机号输入框、发送验证码按钮、验证码输入框、下一步按钮
    - 步骤2应显示手机号显示栏、密码输入框、密码强度提示、确认密码输入框、密码可视化切换按钮、完成按钮
    - 密码强度提示应根据密码复杂度显示弱、中、强三个级别
    - 点击发送验证码按钮时应调用API并显示倒计时
    - 点击下一步按钮时应验证手机号和验证码
    - 点击完成按钮时应创建用户账户
    - 当isLoading状态为true时，相关按钮应被禁用
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

 

- type: Frontend
  id: UI-FlightsSearchCard
  description: 国内机票首页搜索卡组件（单程/往返/多程）
  properties:
    - name: onSearch
      type: function
      description: "提交搜索条件的回调"
  state:
    - tripType
    - fromCity
    - toCity
    - departDate
    - returnDate
    - adults
    - children
    - infants
    - cabin
    - directOnly
    - suggestions
    - isLoading
    - errors
  dependencies:
    - API-GET-AirportSuggest
    - API-GET-FlightsSearch
  acceptanceCriteria:
    - 渲染单程/往返/多程切换与出发/目的地输入框（支持交换）
    - 渲染日期选择器与人数/舱位选择器、直飞筛选
    - 输入联想调用机场联想接口；点击搜索调用航班搜索接口
    - 非法输入时显示错误提示并阻止提交
  changeLog:
    - date: "2025-11-15"
      description: "新增：机票首页搜索卡UI接口"

- type: Frontend
  id: UI-HomePage
  description: 携程首页容器（登录后默认展示机票入口）
  properties:
    - name: onNavigate
      type: function
      description: "导航回调"
  state:
    - none
  dependencies:
    - UI-FlightsSearchCard
  acceptanceCriteria:
    - 页面右侧展示FlightsSearchCard，左侧展示PromotionBanner与QuickLink
    - 登录后从登录页跳转到此页
  changeLog:
    - date: "2025-11-15"
      description: "新增：首页容器UI依赖FlightsSearchCard"

- type: Frontend
  id: UI-FlightsResultsPage
  description: 航班搜索结果页组件
  properties:
    - name: onBook
      type: function
      description: "点击预订回调"
  state:
    - filters
    - sortKey
    - results
    - isLoading
    - errors
  dependencies:
    - API-GET-FlightsSearch
