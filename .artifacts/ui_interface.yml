      description: "查看订单详情回调"
  state:
    - items
    - pagination
    - isLoading
    - errors
  dependencies:
    - API-GET-Orders
  acceptanceCriteria:
    - 展示订单列表与分页，支持查看详情与再次预订
  changeLog:
    - date: "2025-11-15"
      description: "新增：我的订单页UI接口"

- type: Frontend
  id: UI-LoginForm
  description: 账号密码登录表单组件
  properties:
    - name: onSubmit
      type: function
      description: "表单提交回调函数"
    - name: onSwitchToCodeLogin
      type: function
      description: "切换到验证码登录的回调函数"
  state:
    - account
    - password
    - agreeToTerms
    - errors
    - isLoading
  dependencies:
    - none
  acceptanceCriteria:
    - 组件应渲染账号输入框（支持手机号/邮箱/用户名）
    - 组件应渲染密码输入框（密文显示）
    - 组件应渲染服务协议复选框
    - 组件应渲染忘记密码链接和免费注册链接
    - 组件应渲染登录按钮
    - 表单验证应在提交时进行
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Frontend
  id: UI-CodeLoginForm
  description: 验证码登录表单组件
  properties:
    - name: onSubmit
      type: function
      description: "表单提交回调函数"
    - name: onSwitchToAccountLogin
      type: function
      description: "切换到账号密码登录的回调函数"
  state:
    - phoneNumber
    - verificationCode
    - agreeToTerms
    - errors
    - isLoading
    - countdown
  dependencies:
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号输入框
    - 组件应渲染发送验证码按钮（带倒计时功能）
    - 组件应渲染验证码输入框
    - 组件应渲染服务协议复选框
