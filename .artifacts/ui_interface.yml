    - 手机号格式验证应在发送验证码前进行
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Frontend
  id: UI-RegisterStep1
  description: 注册第一步组件 - 验证手机
  properties:
    - name: onNext
      type: function
      description: "下一步回调函数"
  state:
    - phoneNumber
    - verificationCode
    - errors
    - isLoading
    - countdown
  dependencies:
    - API-POST-SendVerificationCode
  acceptanceCriteria:
    - 组件应渲染手机号输入框
    - 组件应渲染发送验证码按钮（带倒计时功能）
    - 组件应渲染验证码输入框
    - 组件应渲染下一步按钮
    - 手机号和验证码验证应在点击下一步时进行
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"

- type: Frontend
  id: UI-RegisterStep2
  description: 注册第二步组件 - 设置密码
  properties:
    - name: onComplete
      type: function
      description: "完成注册回调函数"
    - name: maskedPhone
      type: string
      description: "掩码显示的手机号"
  state:
    - password
    - confirmPassword
    - passwordStrength
    - showPassword
    - showConfirmPassword
    - errors
    - isLoading
  dependencies:
    - none
  acceptanceCriteria:
    - 组件应渲染掩码显示的手机号
    - 组件应渲染密码输入框
    - 组件应渲染密码强度提示（弱/中/强）
    - 组件应渲染确认密码输入框
    - 组件应渲染密码可视化切换按钮
    - 组件应渲染完成按钮和返回上一步按钮
    - 密码强度应实时计算并显示
    - 两次密码一致性验证应在提交时进行
  changeLog:
    - date: "2025-11-11"
      description: "初始创建"
